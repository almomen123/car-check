<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Car Check</title>
<meta name="theme-color" content="#14202b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: phone-first inspection tool. Navy header band with overall progress, soft elevated cards, floating bottom dock. */
:root{
  --bg:#f1f3f8; --surface:#ffffff; --surface-2:#f5f7fb; --line:#e3e8f0; --line-2:#d3dbe7;
  --fg:#0e1726; --muted:#66748a; --accent:#2f5bea; --accent-soft:#e8eeff; --accent-fg:#ffffff;
  --band:#0f1b33; --band-2:#1b2d52; --band-fg:#f3f6fc; --band-muted:#a9b6cf; --gold:#d4b06a;
  --good:#138a52; --good-bg:#e2f5ea; --warn:#b26b00; --warn-bg:#fdf1dc; --bad:#cf3434; --bad-bg:#fde8e8;
  --shadow:0 1px 2px rgba(15,27,51,.05),0 6px 20px rgba(15,27,51,.06);
  --font-body:"Inter","Hind Siliguri",system-ui,sans-serif;
  --font-head:"Space Grotesk","Hind Siliguri",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;
  --r:16px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#090e18; --surface:#111a29; --surface-2:#172235; --line:#202d43; --line-2:#2b3a55;
  --fg:#e9eef7; --muted:#93a1b8; --accent:#6f93ff; --accent-soft:#1b2747; --accent-fg:#0a1020;
  --band:#0b1324; --band-2:#16244a; --band-fg:#eef2fa; --band-muted:#98a6c2; --gold:#e0c084;
  --good:#45c985; --good-bg:#12301f; --warn:#f0b54e; --warn-bg:#352812; --bad:#ff7a7a; --bad-bg:#3a1a1d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090e18; --surface:#111a29; --surface-2:#172235; --line:#202d43; --line-2:#2b3a55;
  --fg:#e9eef7; --muted:#93a1b8; --accent:#6f93ff; --accent-soft:#1b2747; --accent-fg:#0a1020;
  --band:#0b1324; --band-2:#16244a; --band-fg:#eef2fa; --band-muted:#98a6c2; --gold:#e0c084;
  --good:#45c985; --good-bg:#12301f; --warn:#f0b54e; --warn-bg:#352812; --bad:#ff7a7a; --bad-bg:#3a1a1d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);-webkit-text-size-adjust:100%}
body.bn{font-family:"Hind Siliguri","Inter",system-ui,sans-serif}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--font-head);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.12rem} h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.85rem}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* header band */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--band);z-index:20}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:linear-gradient(135deg,var(--band),var(--band-2));color:var(--band-fg);
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px;box-shadow:0 6px 20px rgba(9,14,24,.18)}
.hrow{display:flex;align-items:center;gap:12px;max-width:720px;margin:0 auto;width:100%}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1}
.mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(212,176,106,.45);flex:none}
.brand h1{font-size:1.05rem;letter-spacing:.01em}
.brand .sub{font-size:.8rem;color:var(--band-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langtog{display:flex;background:rgba(255,255,255,.08);border-radius:999px;padding:3px;flex:none}
.langtog button{border:0;background:transparent;padding:5px 11px;font-size:.8rem;font-weight:700;color:var(--band-muted);border-radius:999px}
.langtog button[aria-pressed="true"]{background:var(--band-fg);color:var(--band)}
.prog{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--band-muted)}
.prog .track{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.prog .fillp{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#f3d79c);border-radius:3px;transition:width .3s}
.prog b{color:var(--band-fg);font-variant-numeric:tabular-nums}

main{max-width:720px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}

/* floating dock */
nav.tabs{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:15;
  max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px rgba(15,27,51,.16);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px}
nav.tabs button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:7px 2px;color:var(--muted);font-size:.7rem;font-weight:600;border-radius:14px;transition:background .2s,color .2s}
nav.tabs button svg{width:21px;height:21px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* cards and fields */
.card{background:var(--surface);border-radius:var(--r);padding:18px;display:grid;gap:14px;min-width:0;box-shadow:var(--shadow);border:1px solid var(--line)}
.card.need{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),var(--shadow)}
.chead{display:flex;align-items:center;gap:10px}
.chead .ic{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.chead .ic svg{width:19px;height:19px}
.banner{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;font-size:.9rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:460px){.grid2{grid-template-columns:1fr}}
label.f{display:grid;gap:5px;font-size:.74rem;color:var(--muted);font-weight:600;letter-spacing:.02em;min-width:0}
input[type=text],input[type=number],input[type=tel],input[type=url],select,textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 13px;color:var(--fg);font-size:1rem;font-weight:500;transition:border-color .15s,background .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
textarea{min-height:90px;resize:vertical}
.hint{font-size:.8rem;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:600;font-size:.92rem;transition:transform .1s,background .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.check{display:flex;gap:10px;align-items:center;font-weight:500;font-size:.92rem}
.check input{width:20px;height:20px;accent-color:var(--accent)}

/* choice tiles (fuel, seller) and colour chips */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.choice{border:1.5px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px 8px;display:grid;justify-items:center;gap:6px;font-weight:600;font-size:.84rem;text-align:center;transition:border-color .15s,background .15s}
.choice svg{width:24px;height:24px;color:var(--muted)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.choice[aria-pressed="true"] svg{color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px 6px 6px;font-size:.84rem;font-weight:600}
.sw i{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}
.sw[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:700;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--surface-2);color:var(--muted)}
.tips{margin:0;padding-left:18px;display:grid;gap:5px;font-size:.9rem}

/* checklist */
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
details.sec>summary{list-style:none;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
details.sec .ic{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
details.sec .ic svg{width:20px;height:20px}
details.sec .st{display:grid;gap:6px;min-width:0}
details.sec .st h2{font-size:.98rem}
details.sec .mini{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
details.sec .mini span{display:block;height:100%;border-radius:2px;background:var(--accent);transition:width .3s}
details.sec .chev{transition:transform .2s;color:var(--muted)}
details.sec[open]>summary .chev{transform:rotate(180deg)}
.sechint{padding:0 16px 12px;font-size:.8rem;color:var(--muted)}
.items{display:grid;border-top:1px solid var(--line)}
.item{padding:14px 16px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .lbl{font-weight:500;font-size:.94rem}
.crit{display:inline-block;font-size:.62rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--bad);background:var(--bad-bg);border-radius:6px;padding:2px 6px;margin-left:8px;vertical-align:2px}
.rate{display:flex;gap:6px;flex-wrap:wrap}
.rate button{flex:1;min-width:66px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:11px;padding:8px 6px;font-size:.8rem;font-weight:700;color:var(--muted);transition:all .15s}
.rate button svg{width:14px;height:14px}
.rate button[aria-pressed="true"].ok{background:var(--good);border-color:var(--good);color:#fff}
.rate button[aria-pressed="true"].minor{background:var(--warn);border-color:var(--warn);color:#fff}
.rate button[aria-pressed="true"].major{background:var(--bad);border-color:var(--bad);color:#fff}
.rate button[aria-pressed="true"].na{background:var(--muted);border-color:var(--muted);color:var(--surface)}
.item .extra{display:grid;grid-template-columns:150px 1fr;gap:8px}
@media (max-width:420px){.item .extra{grid-template-columns:1fr}}
.item.two{grid-template-columns:1fr auto;align-items:center}
.item.two .rate{min-width:200px}
.item.two .extra{grid-column:1/-1}

/* scan */
.kv{display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center;margin:0}
.kv dt{color:var(--muted);font-size:.88rem} .kv dd{margin:0;text-align:right;font-weight:600}
.codes{display:grid;gap:8px}
.code{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.code .c{font-family:var(--font-mono);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.tile{background:var(--surface-2);border-radius:12px;padding:11px 12px;display:grid;gap:2px}
.tile .v{font-family:var(--font-mono);font-size:1.3rem;font-weight:600}
.tile .k{font-size:.72rem;color:var(--muted);font-weight:600}
.sens{width:100%;border-collapse:collapse;font-size:.88rem}
.sens td{padding:8px 0;border-bottom:1px solid var(--line)}
.sens td+td{text-align:right;font-family:var(--font-mono);white-space:nowrap;padding-left:12px}
.cyl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.find{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.find:last-child{border-bottom:0}
.sev{width:10px;height:10px;border-radius:50%;margin-top:7px}
.sev.good{background:var(--good)} .sev.warn{background:var(--warn)} .sev.bad{background:var(--bad)} .sev.info{background:var(--muted)}
pre.log{margin:0;max-height:220px;overflow:auto;background:var(--surface-2);border-radius:12px;padding:10px;font:12px/1.45 var(--font-mono);white-space:pre-wrap;word-break:break-all}
.status{display:flex;gap:10px;align-items:center}
.led{width:10px;height:10px;border-radius:50%;background:var(--line-2)}
.led.on{background:var(--good);box-shadow:0 0 0 4px var(--good-bg)}
.step{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:12px;font-weight:600}

/* report */
.herocard{background:linear-gradient(135deg,var(--band),var(--band-2));color:var(--band-fg);border:0}
.herocard .muted,.herocard .small{color:var(--band-muted)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.gauge{width:116px;height:116px}
.verdict{font-family:var(--font-head);font-size:1.3rem;font-weight:700}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:minmax(0,150px) 1fr 40px;gap:10px;align-items:center;font-size:.86rem}
.bar .track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar .fill{display:block;height:100%;border-radius:4px}
.price{display:grid;gap:7px}
.price .ln{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.price .ln span:last-child{white-space:nowrap}
.price .ln.total{border-top:1px solid var(--line);padding-top:9px;font-weight:700}
.callout{border-radius:12px;padding:12px 14px;font-weight:600}
.callout.good{background:var(--good-bg);color:var(--good)} .callout.bad{background:var(--bad-bg);color:var(--bad)} .callout.warn{background:var(--warn-bg);color:var(--warn)}
.issue{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.issue:last-child{border-bottom:0}
.rephead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.herocard .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:var(--band-fg)}
.herocard .btn.primary{background:var(--band-fg);border-color:var(--band-fg);color:var(--band);box-shadow:none}
.saved{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 18px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:30;box-shadow:var(--shadow)}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media print{
  header.top,nav.tabs,.no-print,body::before,.toast{display:none!important}
  body{background:#fff;color:#000}
  main{padding:0;max-width:none}
  .card,details.sec{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .herocard{background:#fff;color:#000}
}
</style>
</head>

<header class="top">
  <div class="hrow">
    <div class="brand">
      <span class="mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d4b06a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15l1.8-5.2c.3-.9 1.2-1.5 2.1-1.5h8.2c.9 0 1.8.6 2.1 1.5L20 15v3.5h-2.4v-1.6H6.4v1.6H4z"/><path d="M9 12.5l2 2 4-4"/></svg></span>
      <div style="min-width:0"><h1>Car Check</h1><div class="sub" id="carSub"></div></div>
    </div>
    <div class="langtog" role="group" aria-label="Language">
      <button id="langEn" data-act="lang" data-v="en">EN</button>
      <button id="langBn" data-act="lang" data-v="bn">বাং</button>
    </div>

  <div class="hrow prog" id="prog"></div>
</header>
<main id="main"></main>
<nav class="tabs" id="tabs"></nav>
<div class="toast" id="toast" hidden></div>

/* ---------- ELM327 parsing ---------- */
function cleanLines(raw){return String(raw).replace(/>/g,'').split(/[\r\n]+/).map(l=>l.trim().toUpperCase())
  .filter(l=>l&&!/^(SEARCHING|BUS INIT|OK$|STOPPED|\?$|TIMEOUT)/.test(l));}
function frames(raw){const lines=cleanLines(raw);
  if(lines.some(l=>/^[0-9A-F]:/.test(l))){let s='';lines.forEach(l=>{const m=l.match(/^([0-9A-F]):\s*(.*)$/);if(m)s+=m[2].replace(/\s/g,'')});return[s]}
  return lines.map(l=>l.replace(/\s/g,'')).filter(l=>/^[0-9A-F]+$/.test(l));}
const noData=raw=>/NO DATA|UNABLE|ERROR|TIMEOUT/i.test(raw)&&!frames(raw).length;
const toBytes=h=>{const b=[];for(let k=0;k+1<h.length;k+=2)b.push(parseInt(h.slice(k,k+2),16));return b};
function pidBytes(raw,mode,pid){const want=(mode+0x40).toString(16).toUpperCase()+pid.toUpperCase();
  for(const m of frames(raw)){let i=-1;while((i=m.indexOf(want,i+1))>=0){if(i%2===0)return toBytes(m.slice(i+want.length))}}
  return null;}
function decodeDtc(h){const n=parseInt(h[0],16);return 'PCBU'[n>>2]+(n&3)+h.slice(1);}
function parseDtcs(raw,resp,isCan){const out=new Set();
  for(const m of frames(raw)){const i=m.indexOf(resp);if(i<0||i%2)continue;let d=m.slice(i+2);if(isCan)d=d.slice(2);
    for(let k=0;k+4<=d.length;k+=4){const c=d.slice(k,k+4);if(c!=='0000')out.add(decodeDtc(c))}}
  return[...out];}
function parseVin(raw,isCan){const b=pidBytes(raw,9,'02');if(!b)return null;let bytes=b;if(isCan&&bytes[0]===1)bytes=bytes.slice(1);
  const s=bytes.filter(x=>x>=0x30&&x<=0x5A).map(x=>String.fromCharCode(x)).join('');return s.length>=11?s.slice(-17):null;}
/* Mode 06 (CAN): records of 9 bytes: MID TID UASID value(2) min(2) max(2) */
function parseMode06(raw,mid){for(const m of frames(raw)){const i=m.indexOf('46');if(i<0||i%2)continue;const b=toBytes(m.slice(i+2));const out={};
  for(let k=0;k+9<=b.length;k+=9){if(b[k]!==mid)continue;out[b[k+1]]=b[k+3]*256+b[k+4]}if(Object.keys(out).length)return out}return null;}
const MON_SPARK=['Catalyst','Heated catalyst','EVAP system','Secondary air','A/C refrigerant','Oxygen sensor','O2 sensor heater','EGR system'];
const MON_BASE=['Misfire','Fuel system','Components'];
function parseMonitors(b){if(!b||b.length<4)return null;const[A,B,C,D]=b;const list=[];
  for(let i=0;i<3;i++)if(B&(1<<i))list.push({n:MON_BASE[i],ok:!(B&(1<<(i+4)))});
  if(!(B&8))for(let i=0;i<8;i++)if(C&(1<<i))list.push({n:MON_SPARK[i],ok:!(D&(1<<i))});
  return{mil:!!(A&0x80),count:A&0x7F,list,incomplete:list.filter(x=>!x.ok).length};}

/* ---------- links ---------- */
const BLE_SVCS=[0xfff0,0xffe0,0x18f0,'e7810a71-73ae-499d-8c15-faa9aef0c3f2'];
class BleLink{
  constructor(){this.buf='';this.q=Promise.resolve();this.demo=false}
  async connect(){
    this.dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:BLE_SVCS});
    this.dev.addEventListener('gattserverdisconnected',()=>this.onLost&&this.onLost());
    const server=await this.dev.gatt.connect();let found=null;
    for(const s of BLE_SVCS){try{const svc=await server.getPrimaryService(s);const ch=await svc.getCharacteristics();
      const rx=ch.find(c=>c.properties.notify||c.properties.indicate),tx=ch.find(c=>c.properties.write||c.properties.writeWithoutResponse);
      if(rx&&tx){found={rx,tx};break}}catch(e){}}
    if(!found)throw new Error('No scanner service found on this device');
    this.rx=found.rx;this.tx=found.tx;await this.rx.startNotifications();
    const dec=new TextDecoder();
    this.rx.addEventListener('characteristicvaluechanged',e=>{this.buf+=dec.decode(e.target.value);this._chk()});
    this.name=this.dev.name||'OBD scanner';
  }
  _chk(){if(this.res&&this.buf.includes('>')){const o=this.buf,r=this.res;this.buf='';this.res=null;clearTimeout(this.tmr);r(o)}}
  send(cmd,timeout=4000){
    const p=this.q.then(()=>new Promise(async resolve=>{
      this.buf='';this.res=resolve;
      this.tmr=setTimeout(()=>{if(this.res){this.res=null;resolve(this.buf+'\nTIMEOUT')}},timeout);
      try{const data=new TextEncoder().encode(cmd+'\r');
        for(let i=0;i<data.length;i+=20){const c=data.slice(i,i+20);
          if(this.tx.properties.writeWithoutResponse)await this.tx.writeValueWithoutResponse(c);else await this.tx.writeValue(c)}}
      catch(e){clearTimeout(this.tmr);this.res=null;resolve('ERROR '+e.message)}
    }));
    this.q=p.catch(()=>{});return p;
  }
  disconnect(){try{this.dev.gatt.disconnect()}catch(e){}}
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function supMask(base,list){let m=0;list.forEach(p=>{const n=parseInt(p,16)-base;if(n>=1&&n<=32)m|=(1<<(32-n))>>>0});return m>>>0;}
class DemoLink{
  constructor(){this.demo=true;this.name='Demo';this.t0=Date.now();this.ac=false}
  async connect(){await sleep(400)}
  disconnect(){}
  async send(cmd){await sleep(cmd==='0100'?600:60);const el=(Date.now()-this.t0)/1000,j=a=>(Math.random()*2-1)*a;
    const h=(n,b=1)=>{n=Math.max(0,Math.round(n));let s='';for(let i=b-1;i>=0;i--)s+=' '+((Math.floor(n/2**(8*i)))&255).toString(16).toUpperCase().padStart(2,'0');return s};
    const SUP=['01','03','04','05','06','07','0B','0C','0D','0E','0F','10','11','13','14','15','1C','1F','20','21','2E','2F','30','31','33','34','3C','40','41','42','43','44','45','46','49','4E'];
    const supResp=base=>'41 '+base.toString(16).toUpperCase().padStart(2,'0')+h(supMask(base,SUP),4);
    const fixed={ATZ:'ELM327 v1.5',ATE0:'OK',ATL0:'OK',ATS0:'OK',ATH0:'OK',ATSP0:'OK',ATAT1:'OK',ATDPN:'A6',ATRV:(14.1+j(.1)).toFixed(1)+'V',
      '0100':'SEARCHING...\r'+supResp(0),'0120':supResp(0x20),'0140':supResp(0x40),'0160':'NO DATA','01A0':'NO DATA',
      '0101':'41 01 00 07 65 21','03':'43 00','07':'47 01 01 71','0A':'4A 00','0902':'NO DATA',
      '0131':'41 31 00 26','014E':'41 4E 00 2D','0130':'41 30 03','0121':'41 21 00 00','01A6':'NO DATA',
      '06A2':'46 A2 0B 24 00 01 00 00 FF FF A2 0C 24 00 00 00 00 FF FF','06A3':'46 A3 0B 24 00 00 00 00 FF FF A3 0C 24 00 00 00 00 FF FF',
      '06A4':'46 A4 0B 24 00 09 00 00 FF FF A4 0C 24 00 06 00 00 FF FF','06A5':'46 A5 0B 24 00 01 00 00 FF FF A5 0C 24 00 00 00 00 FF FF'}[cmd];
    if(fixed)return fixed+'\r\r>';
    const idle=this.forceIdle||el%40<25,spd=idle?0:Math.min(70,(el%40-25)*6),rpm=(idle?(this.ac?760:720):1500+spd*25)+j(idle?20:40),load=(idle?(this.ac?33:24):45)+j(2);
    const v={'0C':h(rpm*4,2),'0D':h(spd),'05':h(Math.min(88,62+el/3)+40),'06':h(128+(6+j(3))*1.28),'07':h(128+14*1.28),'42':h((14.1+j(.1))*1000,2),
      '04':h(load*2.55),'0F':h(74),'10':h((idle?(this.ac?3.4:2.6):9+spd/8)*100,2),'11':h((idle?14:28)*2.55),'0B':h(idle?31:55),'0E':h((idle?8:18)*2+128),
      '14':h((.1+Math.random()*.7)*200),'15':h(.68*200),'1F':h(el+300,2),'2F':h(55*2.55),'33':h(101),'34':h(32768+j(400),2),'3C':h((520+40)*10,2),
      '43':h(30*2.55,2),'44':h(32768,2),'46':h(70),'49':h((idle?0:22)*2.55)}[cmd.slice(2)];
    return (cmd.startsWith('01')&&v?'41 '+cmd.slice(2)+v:'NO DATA')+'\r\r>';}
}

/* ---------- scan logic ---------- */
function log(cmd,res){logLines.push('> '+cmd+'\n'+String(res).replace(/\r/g,'\n').replace(/\n+/g,'\n').trim());if(logLines.length>500)logLines.shift();
  const el=document.getElementById('logBox');if(el){el.textContent=logLines.join('\n');el.scrollTop=el.scrollHeight}}
async function cmd(c,to){const r=await link.send(c,to);log(c,r);return r}
async function initAdapter(){await cmd('ATZ',5000);await sleep(300);for(const c of['ATE0','ATL0','ATS0','ATH0','ATAT1','ATSP0'])await cmd(c,2000);}
async function readSupport(){const set=new Set();let base=0;
  while(base<=0xA0){const pid=base.toString(16).toUpperCase().padStart(2,'0');const b=pidBytes(await cmd('01'+pid,base===0?12000:3000),1,pid);if(!b||b.length<4)break;
    const mask=((b[0]<<24)>>>0)+(b[1]<<16)+(b[2]<<8)+b[3];
    for(let n=1;n<=32;n++)if(mask&((1<<(32-n))>>>0))set.add((base+n).toString(16).toUpperCase().padStart(2,'0'));
    if(!set.has((base+32).toString(16).toUpperCase().padStart(2,'0')))break;base+=32;}
  return set;}
const supported=p=>!sup||sup.has(p);
async function readPid(p){const bb=pidBytes(await link.send('01'+p,2500),1,p);if(!bb)return null;const d=PID_DEFS[p];try{return d[4](bb)}catch(e){return null}}
async function runFullScan(){if(!link||busy)return;busy=true;render();
  try{const sc={at:new Date().toISOString(),demo:!!link.demo};
    const rv=await cmd('ATRV',2000);const mv=rv.match(/(\d+(\.\d+)?)\s*V/i);sc.adapterVolt=mv?+mv[1]:null;
    sup=await readSupport();sc.sup=[...sup];
    const dp=(await cmd('ATDPN',2000)).replace(/[^0-9A-F]/gi,'').replace(/^A/i,'');sc.proto=dp;sc.isCan=/^[6-9AB]$/i.test(dp);
    sc.mon=parseMonitors(pidBytes(await cmd('0101'),1,'01'));
    sc.stored=parseDtcs(await cmd('03',6000),'43',sc.isCan);
    sc.pending=parseDtcs(await cmd('07',6000),'47',sc.isCan);
    const pr=await cmd('0A',6000);sc.permanent=noData(pr)?[]:parseDtcs(pr,'4A',sc.isCan);
    sc.vin=parseVin(await cmd('0902',6000),sc.isCan);
    let b=pidBytes(await cmd('0131'),1,'31');sc.distCleared=b?b[0]*256+b[1]:null;
    b=pidBytes(await cmd('014E'),1,'4E');sc.timeCleared=b?b[0]*256+b[1]:null;
    b=pidBytes(await cmd('0130'),1,'30');sc.warmups=b?b[0]:null;
    b=pidBytes(await cmd('0121'),1,'21');sc.distMil=b?b[0]*256+b[1]:null;
    b=pidBytes(await cmd('01A6'),1,'A6');sc.odo=b&&b.length>=4?PID_DEFS.A6[4](b):null;
    sc.snap={};for(const p of Object.keys(PID_DEFS)){if(p==='A6'||!sup.has(p))continue;const v=await readPid(p);if(v!=null){sc.snap[PID_DEFS[p][0]]=v;liveNow[PID_DEFS[p][0]]=v}}
    const old=S.scan||{};sc.samples=old.samples||[];sc.cyl=old.cyl||null;sc.ac=old.ac||null;
    S.scan=sc;S.sample=false;save();toast(t('savedT'));
  }catch(e){log('ERROR',e.message)}
  busy=false;render();}
async function liveLoop(){const slow=Object.keys(PID_DEFS).filter(p=>!FAST.includes(p)&&p!=='A6'&&supported(p));let si=0;
  if(!S.scan)S.scan={at:new Date().toISOString(),demo:!!link.demo,samples:[]};
  while(recording&&link){const row={t:Date.now()};
    for(const p of FAST){if(!recording)break;if(!supported(p))continue;const v=await readPid(p);if(v!=null){row[PID_DEFS[p][0]]=v;liveNow[PID_DEFS[p][0]]=v}}
    if(slow.length&&recording){const p=slow[si++%slow.length];const v=await readPid(p);if(v!=null)liveNow[PID_DEFS[p][0]]=v}
    if(useGps&&gpsSpeed!=null)row.gps=gpsSpeed;
    S.scan.samples=(S.scan.samples||[]);S.scan.samples.push(row);if(S.scan.samples.length>1500)S.scan.samples.shift();
    updateLive();}
  save();}
function startGps(){if(!navigator.geolocation){toast(t('gpsFail'));return false}

function stopGps(){if(gpsWatch!=null)navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null;gpsSpeed=null;}
async function runCylTest(){if(!link||busy)return;busy=true;render();
  try{const res={};let any=false;for(let c=1;c<=4;c++){const mid=0xA1+c;const r=parseMode06(await cmd('06'+mid.toString(16).toUpperCase(),4000),mid);

async function acSample(){const rows=[];for(let i=0;i<15;i++){const r={};for(const p of['0C','04','10']){if(!supported(p))continue;const v=await readPid(p);if(v!=null)r[PID_DEFS[p][0]]=v}rows.push(r);await sleep(150)}
  const st=k=>sampleStats(rows,k);const rp=st('rpm'),ld=st('load'),mf=st('maf');
  return{rpm:rp&&rp.avg,sd:rp&&rp.sd,load:ld&&ld.avg,maf:mf&&mf.avg};}
async function acStep(){if(!link||busy)return;busy=true;if(link.demo)link.forceIdle=true;
  if(acStage==='ready'||acStage==='done'){acStage='runOff';render();if(link.demo)link.ac=false;const off=await acSample();
    if(!S.scan)S.scan={at:new Date().toISOString(),demo:!!link.demo,samples:[]};S.scan.ac={off};acStage='waitOn';}
  else if(acStage==='waitOn'){acStage='runOn';render();if(link.demo)link.ac=true;await sleep(link.demo?300:5000);S.scan.ac.on=await acSample();acStage='done';link.forceIdle=false;save();}

function sampleStats(samples,k,filter){const v=samples.filter(filter||(()=>true)).map(s=>s[k]).filter(x=>x!=null&&!isNaN(x));if(!v.length)return null;
  const avg=v.reduce((a,b)=>a+b,0)/v.length;const sd=Math.sqrt(v.reduce((a,b)=>a+(b-avg)**2,0)/v.length);return{avg,sd,min:Math.min(...v),max:Math.max(...v),n:v.length};}

function analyzeScan(sc,hyb){
  const F=[];let sc100=100;const add=(sev,en,bn,pen)=>{F.push({sev,en,bn});sc100-=pen||0};
  if(!sc)return{findings:[],score:null,capRisky:false};
  if(sc.demo)add('info','Demo data — not a real car.','ডেমো ডেটা — আসল গাড়ি নয়।');
  const m=sc.mon;
  if(m&&m.mil)add('bad','Check engine light is ON.','চেক ইঞ্জিন লাইট জ্বলছে।',25);
  if(sc.stored&&sc.stored.length)add('bad',sc.stored.length+' stored fault code(s): '+sc.stored.join(', '),sc.stored.length+'টি স্টোর করা ফল্ট কোড: '+sc.stored.join(', '),Math.min(45,15*sc.stored.length));
  if(sc.pending&&sc.pending.length)add('warn','Pending code(s) — a fault the car is still confirming: '+sc.pending.join(', '),'পেন্ডিং কোড — গাড়ি এখনো সমস্যা নিশ্চিত করছে: '+sc.pending.join(', '),Math.min(24,8*sc.pending.length));
  if(sc.permanent&&sc.permanent.length)add('warn','Permanent code(s) — a recent fault that clearing cannot hide: '+sc.permanent.join(', '),'স্থায়ী কোড — সাম্প্রতিক সমস্যা যা মুছে লুকানো যায় না: '+sc.permanent.join(', '),10);
  const recentDist=sc.distCleared!=null&&sc.distCleared<300,recentTime=sc.timeCleared!=null&&sc.timeCleared<300,
        fewWarm=sc.warmups!=null&&sc.warmups<10,incomplete=m&&m.incomplete>=2;
  let capRisky=false;
  if(recentDist||recentTime||(fewWarm&&incomplete)){capRisky=true;
    add('bad','Codes were cleared recently'+(sc.distCleared!=null?' (only '+sc.distCleared+' km ago)':'')+'. The seller may be hiding a problem. Re-scan after 200+ km of driving.',
      'সম্প্রতি কোড মোছা হয়েছে'+(sc.distCleared!=null?' (মাত্র '+sc.distCleared+' কিমি আগে)':'')+'। বিক্রেতা সমস্যা লুকাতে পারেন। ২০০+ কিমি চালানোর পর আবার স্ক্যান করুন।',35);}
  else if(sc.distCleared!=null)add('good','No sign of recent code clearing ('+sc.distCleared+' km since last clear).','সম্প্রতি কোড মোছার চিহ্ন নেই (শেষবার মোছার পর '+sc.distCleared+' কিমি)।');
  if(m&&m.incomplete>0&&!capRisky)add('warn',m.incomplete+' readiness monitor(s) not complete.',m.incomplete+'টি রেডিনেস মনিটর সম্পূর্ণ হয়নি।',Math.min(15,5*m.incomplete));
  const km=+S.car.km;
  if(sc.odo!=null&&km){const d=Math.abs(sc.odo-km);if(d>1000)add('bad','Odometer in the engine computer ('+Math.round(sc.odo)+' km) does not match the dashboard ('+km+' km). Possible rollback.','ইঞ্জিন কম্পিউটারের ওডোমিটার ('+Math.round(sc.odo)+' কিমি) ড্যাশবোর্ডের ('+km+' কিমি) সাথে মিলছে না। মাইলেজ কমানো হতে পারে।',30);
    else add('good','Odometer matches the engine computer.','ওডোমিটার ইঞ্জিন কম্পিউটারের সাথে মিলেছে।');}
  else add('info','This car does not report the odometer to the scanner. Judge mileage by wear and service records.','এই গাড়ি স্ক্যানারে ওডোমিটার জানায় না। ক্ষয় ও সার্ভিস রেকর্ড দেখে মাইলেজ বুঝুন।');
  const smp=sc.samples||[];
  const lt=sampleStats(smp,'ltft'),st=sampleStats(smp,'stft');const ltv=lt?lt.avg:(sc.snap&&sc.snap.ltft),stv=st?st.avg:(sc.snap&&sc.snap.stft);
  if(ltv!=null){const tot=ltv+(stv||0);
    if(Math.abs(tot)>20)add('bad','Fuel trims far off ('+tot.toFixed(1)+'%). Look for air leaks, injectors or the air flow sensor.','ফুয়েল ট্রিম অনেক বেশি ('+tot.toFixed(1)+'%)। এয়ার লিক, ইনজেক্টর বা এয়ার ফ্লো সেন্সর দেখুন।',15);
    else if(Math.abs(tot)>10)add('warn','Fuel trims a bit high ('+tot.toFixed(1)+'%). Possible small air leak, weak injector or sensor.','ফুয়েল ট্রিম একটু বেশি ('+tot.toFixed(1)+'%)। ছোট এয়ার লিক, দুর্বল ইনজেক্টর বা সেন্সর হতে পারে।',7);
    else add('good','Fuel trims normal ('+tot.toFixed(1)+'%) — injectors and air flow look fine.','ফুয়েল ট্রিম স্বাভাবিক ('+tot.toFixed(1)+'%) — ইনজেক্টর ও এয়ার ফ্লো ঠিক মনে হচ্ছে।');}
  const idleMaf=sampleStats(smp,'maf',s=>s.spd===0&&s.rpm>400);const mafv=idleMaf?idleMaf.avg:(sc.snap&&sc.snap.maf);
  if(mafv!=null&&!hyb){if(mafv<1.5)add('warn','Air flow at idle is low ('+mafv.toFixed(1)+' g/s). Air flow sensor may be dirty.','আইডলে এয়ার ফ্লো কম ('+mafv.toFixed(1)+' g/s)। এয়ার ফ্লো সেন্সর ময়লা হতে পারে।',4);
    else if(mafv<=7)add('good','Air flow at idle normal ('+mafv.toFixed(1)+' g/s).','আইডলে এয়ার ফ্লো স্বাভাবিক ('+mafv.toFixed(1)+' g/s)।');}
  const vs=sampleStats(smp,'volt',s=>s.rpm>500);const vv=vs?vs.avg:(sc.snap&&sc.snap.rpm>500?sc.snap.volt:null);
  if(vv!=null){if(vv<13.2)add('warn','Charging voltage low ('+vv.toFixed(2)+' V). Check alternator'+(hyb?' / DC-DC converter':'')+' and 12V battery.','চার্জিং ভোল্টেজ কম ('+vv.toFixed(2)+' V)। অল্টারনেটর'+(hyb?' / ডিসি-ডিসি কনভার্টার':'')+' ও ১২ ভোল্ট ব্যাটারি দেখুন।',7);
    else if(vv>15)add('bad','Charging voltage too high ('+vv.toFixed(2)+' V).','চার্জিং ভোল্টেজ অনেক বেশি ('+vv.toFixed(2)+' V)।',10);
    else add('good','Charging voltage normal ('+vv.toFixed(2)+' V).','চার্জিং ভোল্টেজ স্বাভাবিক ('+vv.toFixed(2)+' V)।');}
  const ec=sampleStats(smp,'ect');const ecmax=ec?ec.max:(sc.snap&&sc.snap.ect);
  if(ecmax!=null&&ecmax>105)add('bad','Engine ran hot ('+Math.round(ecmax)+' °C). Check radiator, fan and coolant.','ইঞ্জিন বেশি গরম হয়েছে ('+Math.round(ecmax)+' °C)। রেডিয়েটর, ফ্যান ও কুল্যান্ট দেখুন।',15);
  else if(ecmax!=null&&ecmax>=80)add('good','Engine temperature normal ('+Math.round(ecmax)+' °C).','ইঞ্জিনের তাপমাত্রা স্বাভাবিক ('+Math.round(ecmax)+' °C)।');
  if(ec&&smp.length>150&&ecmax<70)add('warn','Engine stayed cold during the drive. Thermostat may be stuck open.','ড্রাইভে ইঞ্জিন ঠান্ডা ছিল। থার্মোস্ট্যাট খোলা আটকে থাকতে পারে।',5);
  if(!hyb){const idle=sampleStats(smp,'rpm',s=>s.spd===0&&s.rpm>400);
    if(idle&&idle.n>15){if(idle.sd>80)add('warn','Idle is unsteady (±'+Math.round(idle.sd)+' rpm).','আইডল অস্থির (±'+Math.round(idle.sd)+' আরপিএম)।',6);
      else add('good','Idle steady at '+Math.round(idle.avg)+' rpm.','আইডল স্থির, '+Math.round(idle.avg)+' আরপিএম।');}}
  let flares=0;for(let i=1;i<smp.length;i++){const p=smp[i-1],r=smp[i];if(p.spd>15&&r.rpm-p.rpm>600&&r.spd-p.spd<=1)flares++}
  if(smp.filter(s=>s.spd>15).length>20){if(flares>=2)add('warn','RPM jumped without speed rising '+flares+' times. Possible gearbox slip.','গতি না বেড়ে আরপিএম '+flares+' বার লাফিয়েছে। গিয়ারবক্স স্লিপ হতে পারে।',10);
    else add('good','RPM and speed stayed in sync while driving.','ড্রাইভে আরপিএম ও গতি একসাথে ছিল।');}
  const gp=smp.filter(s=>s.gps>20&&s.spd>0);
  if(gp.length>=10){const ratio=gp.reduce((a,s)=>a+s.spd/s.gps,0)/gp.length,pct=(ratio-1)*100;
    if(Math.abs(pct)>5)add('warn','Speed reading is '+Math.abs(pct).toFixed(0)+'% '+(pct>0?'higher':'lower')+' than GPS. Tyre size or gauge may be changed.','গতির রিডিং জিপিএসের চেয়ে '+Math.abs(pct).toFixed(0)+'% '+(pct>0?'বেশি':'কম')+'। টায়ারের সাইজ বা মিটার বদলানো হতে পারে।',4);
    else add('good','Speed reading matches GPS (within '+Math.abs(pct).toFixed(0)+'%).','গতির রিডিং জিপিএসের সাথে মিলেছে ('+Math.abs(pct).toFixed(0)+'% এর মধ্যে)।');}
  if(sc.cyl&&sc.cyl!=='none'){const v=Object.values(sc.cyl),mx=Math.max(...v),worst=Object.keys(sc.cyl).find(k=>sc.cyl[k]===mx);const rest=v.filter(x=>x!==mx);const avgRest=rest.length?rest.reduce((a,b)=>a+b,0)/rest.length:0;
    if(mx>=20)add('bad','Cylinder '+worst+' is misfiring ('+mx+' counts). Check plug, coil and injector.','সিলিন্ডার '+worst+' মিসফায়ার করছে ('+mx+' বার)। প্লাগ, কয়েল ও ইনজেক্টর দেখুন।',15);
    else if(mx>=5&&mx>avgRest*3)add('warn','Cylinder '+worst+' misfires more than the others ('+mx+'). Check plug, coil and injector.','সিলিন্ডার '+worst+' অন্যগুলোর চেয়ে বেশি মিসফায়ার করছে ('+mx+')। প্লাগ, কয়েল ও ইনজেক্টর দেখুন।',8);
    else add('good','All cylinders burning evenly.','সব সিলিন্ডার সমানভাবে জ্বলছে।');}
  if(sc.ac&&sc.ac.on&&sc.ac.off.rpm!=null){const a=sc.ac,dl=(a.on.load||0)-(a.off.load||0),dr=(a.on.rpm||0)-(a.off.rpm||0);
    if(a.off.rpm>1200||(a.off.sd||0)>250)add('info','AC test: the engine was not idling. Park the car and run the test again.','এসি টেস্ট: ইঞ্জিন আইডলে ছিল না। গাড়ি দাঁড় করিয়ে আবার টেস্ট চালান।');
    else if(dr<-100)add('warn','Idle drops '+Math.round(-dr)+' rpm with AC on. Throttle body or idle control may need cleaning.','এসি চালু করলে আইডল '+Math.round(-dr)+' আরপিএম কমে যায়। থ্রটল বডি বা আইডল কন্ট্রোল পরিষ্কার লাগতে পারে।',5);
    else if(a.on.sd>100)add('warn','Idle becomes unsteady with AC on.','এসি চালু করলে আইডল অস্থির হয়।',5);
    else if(dl<2&&!hyb)add('warn','Engine load barely changes with AC on. The AC compressor may not be engaging.','এসি চালু করলেও ইঞ্জিন লোড প্রায় বদলায় না। এসি কম্প্রেসর কাজ নাও করতে পারে।',5);
    else if(dl>30)add('warn','AC puts a very heavy load on the engine (+'+Math.round(dl)+'%). Check the compressor.','এসি ইঞ্জিনে অনেক বেশি লোড দিচ্ছে (+'+Math.round(dl)+'%)। কম্প্রেসর দেখুন।',5);
    else add('good','AC load test normal: load +'+Math.round(dl)+'%, idle steady.','এসি লোড টেস্ট স্বাভাবিক: লোড +'+Math.round(dl)+'%, আইডল স্থির।');}
  if(sc.adapterVolt!=null&&sc.adapterVolt<12.2&&!(vv>13))add('warn','12V battery looks weak ('+sc.adapterVolt+' V).','১২ ভোল্ট ব্যাটারি দুর্বল মনে হচ্ছে ('+sc.adapterVolt+' V)।',4);
  return{findings:F,score:Math.max(0,sc100),capRisky};}

/* ---------- scoring ---------- */
const RVAL={ok:1,minor:.6,major:0};
function compute(){
  const hyb=isHyb();const secs=[];const fails=[];let repairs=0,rated=0,total=0;const issues=[];
  for(const sec of SECTIONS){if(!secOn(sec))continue;let sum=0,n=0;
    for(const it of sec.items){if(!itemOn(it))continue;total++;const c=S.checks[it[0]];
      if(c&&c.r&&c.r!=='ok'&&c.r!=='na'&&c.cost)repairs+=+c.cost||0;
      if(!c||!c.r)continue;rated++;if(c.r==='na')continue;sum+=sec.two?(c.r==='ok'?1:.8):RVAL[c.r];n++;
      if(c.r!=='ok')issues.push({sec:sec.k,label:bi(it[2],it[3]),r:c.r,cost:+c.cost||0,note:c.note||''});
      if(c.r==='major'&&it[1])fails.push(bi(it[2],it[3]));}
    if(n)secs.push({k:sec.k,w:sec.w,s:sum/n*100});}
  const an=analyzeScan(S.scan,hyb);if(an.score!=null)secs.push({k:'scan',w:15,s:an.score});
  if(hyb&&S.hybrid.health!==''&&!isNaN(+S.hybrid.health)){const h=Math.max(0,Math.min(100,+S.hybrid.health));secs.push({k:'hybrid',w:12,s:h});
    if(h<60)fails.push(bi('Hybrid battery very weak ('+h+'%)','হাইব্রিড ব্যাটারি খুব দুর্বল ('+fmt(h)+'%)'));}
  const W=secs.reduce((a,b)=>a+b.w,0);const score=W?secs.reduce((a,b)=>a+b.s*b.w,0)/W:null;
  const progress=total?rated/total:0;
  let v=null;if(score!=null){v=fails.length?'reject':score>=85?'excellent':score>=70?'good':score>=55?'risky':'skip';
    if(an.capRisky&&(v==='excellent'||v==='good'))v='risky';}
  if(v&&v!=='reject'&&progress<.6)v='incomplete';
  const c=S.car,market=+c.market||0,asking=+c.asking||0;let price=null;
  if(market){const fees=(+c.papersCost||0)+(+c.adsCost||0),profit=+c.profit||0;
    const maxBuy=market-repairs-fees-profit;const adj=score!=null?Math.max(0,85-score)*0.004:0;const fair=market*(1-adj)-repairs;
    price={market,repairs,fees,profit,maxBuy,fair,asking,gap:asking?asking-maxBuy:null};}
  return{score,verdict:v,secs,fails,repairs,issues,price,progress,scan:an};}
const vClass=v=>({excellent:'good',good:'good',risky:'warn',skip:'bad',reject:'bad',incomplete:'info'}[v]||'info');
const sColor=s=>s>=85?'var(--good)':s>=70?'var(--accent)':s>=55?'var(--warn)':'var(--bad)';

function vScan(){const sc=S.scan,hyb=isHyb(),btOk=!!navigator.bluetooth;
  const conn=link?`<div class="status"><span class="led on"></span><b>${link.demo?t('demoMode'):t('connectedTo')+' '+esc(linkName)}</b></div>`:`<div class="status"><span class="led"></span><span class="muted">${t('notConnected')}</span></div>`;
  let h=`<section class="card"><h2>${t('scan')}</h2>${conn}<p class="hint">${t('scanHint')}</p>
    ${!btOk&&!link?`<div class="callout warn small">${t('noBt')}</div>`:''}

function liveSrc(){return Object.keys(liveNow).length?liveNow:((S.scan&&S.scan.snap)||{});}

  const vals=Object.assign({},src,{ratio:src.spd>5&&src.rpm?src.rpm/src.spd:null});
  return Object.keys(d).filter(k=>k!=='gps'||useGps||vals.gps!=null).map(k=>`<div class="tile"><span class="v">${vals[k]!=null?(+vals[k]).toFixed(d[k]):'—'}</span><span class="k">${t(k)}</span></div>`).join('');}

  return rows.map(p=>{const d=PID_DEFS[p];return`<tr><td>${bi(d[1],d[2])}</td><td>${(+src[d[0]]).toFixed(d[5])} ${d[3]}</td></tr>`}).join('');}

function gauge(score,verdict){const s=score==null?0:score,r=46,C=2*Math.PI*r,len=C*.75,
  col=score==null?'var(--line)':verdict&&verdict!=='incomplete'?{good:'var(--good)',warn:'var(--warn)',bad:'var(--bad)'}[vClass(verdict)]:sColor(s);
  return `<svg class="gauge" viewBox="0 0 110 110" role="img" aria-label="${t('score')} ${score==null?'—':Math.round(s)}">
   <circle cx="55" cy="55" r="${r}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="9" stroke-dasharray="${len} ${C}" transform="rotate(135 55 55)" stroke-linecap="round"/>
   <circle cx="55" cy="55" r="${r}" fill="none" stroke="${col}" stroke-width="9" stroke-dasharray="${len*s/100} ${C}" transform="rotate(135 55 55)" stroke-linecap="round"/>
   <text x="55" y="61" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="30" font-weight="700" fill="currentColor">${score==null?'—':fmt(s)}</text>
   <text x="55" y="80" text-anchor="middle" font-size="10" fill="currentColor" opacity=".6">/ ${fmt(100)}</text></svg>`;}

    if(p.asking)h+=p.gap<=0?`<div class="callout good">${t('goodDeal')}</div>`:`<div class="callout ${p.gap>p.market*.05?'bad':'warn'}">${t('overBy')} ${tk(p.gap)} · ${t('offer')} ${tk(p.maxBuy)}</div>`;}

  if(a==='full'){runFullScan();return}

    if(copy.scan)copy.scan.samples=(copy.scan.samples||[]).slice(-300);list.push(copy);store.set('cc.list',list);save();toast(t('savedT'));return}
  if(a==='openSaved'){const it=store.get('cc.list',[]).find(x=>x.id===id);if(it){S=migrate(JSON.parse(JSON.stringify(it)));save();tab='report';store.set('cc.tab','report');render();window.scrollTo(0,0)}return}
  if(a==='askDel'){document.getElementById('act_'+id).innerHTML=`<span class="small">${t('confirmDel')}</span><button class="btn danger" data-act="del" data-id="${id}">${t('yes')}</button><button class="btn" data-act="tab" data-v="saved">${t('cancel')}</button>`;return}

  if(a==='export'){const blob=new Blob([JSON.stringify({app:'car-check',v:2,list:store.get('cc.list',[])},null,1)],{type:'application/json'});

  try{const d=JSON.parse(await f.text());if(d.app!=='car-check'||!Array.isArray(d.list))throw 0;const list=store.get('cc.list',[]);const ids=new Set(list.map(x=>x.id));
    d.list.forEach(x=>{if(!ids.has(x.id))list.push(migrate(x))});store.set('cc.list',list);toast(t('imported'));render()}catch(err){toast(t('importFail'))}e.target.value='';});
let toastT;function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2200);}

render();
</script>
